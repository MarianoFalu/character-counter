<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>character counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="/assets/img/logo.png" alt="logo">
            <h2>Character Counter</h2>
        </div>
        <button>⚙️</button> 
        <!-- explicar despues que hará el boton en el README -->
    </header>
    <main>
        <section class="hero">
            <h1>Analyze your text in real-time.</h1>
            <textarea name="text" id="text" placeholder="Start typing here..."></textarea>
        </section>
        <section class="controls">
            <div class="left-controls">
                <input type="checkbox" id="spaces">
                <label for="spaces">Exclude Spaces</label>

                <input type="checkbox" id="limit">
                <label for="limit">Set Character Limit</label>
            </div>
            <p>Approx. reading time: &lt;1 minute</p>
            <!-- &lt; representa < / asi el visual code no lo lee como una etiqueta -->
        </section>
    </main>
</body>
</html>
