<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>character counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <header>
            <div class="logo">
                <img src="/assets/img/logo.png" alt="logo">
                <h1>Character Counter</h1>
            </div>
            <button>⚙️</button> 
            <!-- explicar despues que hará el boton en el README -->
        </header>

        <section class="hero">
            <h2>Analyze your text in real-time.</h2>
            <textarea name="text" id="text" placeholder="Start typing here..."></textarea>
        </section>

        <section class="controls">
            <div class="left-controls">
                <input type="checkbox" id="spaces">
                <label for="spaces">Exclude Spaces</label>

                <input type="checkbox" id="limit">
                <label for="limit">Set Character Limit</label>
            </div>
            <p>Approx. reading time: &lt;1 minute</p>
            <!-- &lt; representa < / asi el visual code no lo lee como una etiqueta -->
        </section>

        <section class="cards">
            <div class="characters">
                <p class="number">278</p>
                <p class="label">Total Characters</p>
            </div>
            <div class="word">
                <p class="number">39</p>
                <p class="label">Word Count</p>
            </div>
            <div class="sentence">
                <p class="number">04</p>
                <p class="label">Sentence Count</p>
            </div>
        </section>

        <section class="letter density">
            <h3>Letter Density</h3>
            <div class="row">
                <span class="letter">E</span>
                <div class="bar">
                    <div class="fill"></div>
                </div>
                <span class="info">40 (16.06%)</span>
            </div>
            <div class="row">
                <span class="letter">I</span>
                <div class="bar">
                    <div class="fill"></div>
                </div>
                <span class="info">29 (11.65%)</span>
            </div>
            <div class="row">
                <span class="letter">T</span>
                <div class="bar">
                    <div class="fill"></div>
                </div>
                <span class="info">28 (11.24%)</span>
            </div>
            <div class="row">
                <span class="letter">O</span>
                <div class="bar">
                    <div class="fill"></div>
                </div>
                <span class="info">22 (8.84%)</span>
            </div>
            <div class="row">
                <span class="letter">N</span>
                <div class="bar">
                    <div class="fill"></div>
                </div>
                <span class="info">21 (8.43%)</span>
            </div>
            <button class="seemore">See more ▾</button>
        </section>

    </main>
</body>
</html>
